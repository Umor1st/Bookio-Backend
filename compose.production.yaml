services:
  bookio-caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    environment:
      ACME_CA: ${ACME_CA:?Set ACME_CA}
      ACME_EMAIL: ${ACME_EMAIL:?Set ACME_EMAIL}
    ports:
      - "127.0.0.1:8443:8443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    networks:
      ingress:
        ipv4_address: 172.30.87.3
    depends_on:
      bookio-backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "nc -z 127.0.0.1 8443"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 60s

  bookio-backend:
    image: ghcr.io/umor1st/bookio-backend:latest
    restart: unless-stopped
    environment:
      PORT: 8080
      AUTH_TRUSTED_PROXY_ADDRESS: 172.30.87.2
      DB_HOST: bookio-postgres
      DB_PORT: 5432
      DB_NAME: ${DB_NAME:?Set DB_NAME}
      DB_USER: ${DB_USER:?Set DB_USER}
      DB_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD}
    volumes:
      - bookio_covers:/app/covers
    networks:
      - ingress
      - backend
    depends_on:
      bookio-postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:8080/health"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 30s

  bookio-postgres:
    image: postgres:17
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME:?Set DB_NAME}
      POSTGRES_USER: ${DB_USER:?Set DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - backend
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 12

networks:
  ingress:
    ipam:
      config:
        - subnet: 172.30.87.0/24
          gateway: 172.30.87.1
  backend:
    internal: true

volumes:
  postgres_data:
  bookio_covers:
  caddy_data:
  caddy_config:
