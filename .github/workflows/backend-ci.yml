name: CI Bookio-Backend
run-name: Проверка и сборка Bookio-Backend

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read
  packages: write

jobs:
  checks:
    name: Проверка и сборка
    runs-on: ubuntu-latest
    steps:
      - name: Получение исходного кода
        uses: actions/checkout@v7
      - name: Настройка Java и кэша Gradle
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle
      - name: Сборка, тестирование и подготовка дистрибутива
        run: ./gradlew build installDist --no-daemon
      - name: Настройка Docker Buildx
        uses: docker/setup-buildx-action@v4
      - name: Определение имени образа
        id: image
        env:
          OWNER: ${{ github.repository_owner }}
        run: echo "name=ghcr.io/${OWNER,,}/bookio-backend" >> "$GITHUB_OUTPUT"
      - name: Вход в реестр образов
        uses: docker/login-action@v4
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Подготовка тегов и меток образа
        uses: docker/metadata-action@v6
        id: meta
        with:
          images: ${{ steps.image.outputs.name }}
          tags: |
            type=raw,value=latest
            type=sha,format=short
      - name: Сборка образа и публикация из main
        uses: docker/build-push-action@v7
        with:
          context: ./build/install/Bookio-Backend
          file: ./Dockerfile.ci
          platforms: linux/amd64
          push: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
          provenance: false
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
