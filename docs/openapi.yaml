        Только ФИО и класс; логин, пароль и роль не меняются. Перед проверкой сервер обрезает
        строки через trim и отклоняет пустые после trim lastName, firstName и classLetter.
        После объединения PATCH с текущими данными ученика grade и classLetter должны
        оставаться заполненными. Пустое или состоящее только из пробелов middleName
        нормализуется сервером в null.
