        - "LIBRARIAN"
      x-required-account-status:
        - "ACTIVE"
      parameters:
        - name: "accountStatus"
          in: "query"
          required: false
          description: "Статус аккаунта. PENDING выбирает ожидающих подтверждения."
          schema:
            $ref: "#/components/schemas/AccountStatus"
        - name: "grade"
          in: "query"
          required: false
          description: "Номер класса."
          schema:
            type: "integer"
            minimum: 1
            maximum: 11
        - name: "classLetter"
          in: "query"
          required: false
          description: >-
            От 1 до 5 символов в декодированном значении до обрезки. Сервер удаляет пробелы по краям и сравнивает без учёта
            регистра. Пустое значение, в том числе после обрезки, даёт 400 INVALID_DATA. Без параметра фильтр не применяется.
          schema:
            type: "string"
            minLength: 1
            maxLength: 5
        - name: "overdueOnly"
          in: "query"
          required: false
          description: "true оставляет должников по фактическому сроку возврата. false или отсутствие снимает фильтр."
          schema:
            type: "boolean"
            default: false
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Offset"
      x-error-codes:
        "400":
          - "INVALID_DATA"
        "401":
          - "INVALID_SESSION"
        "403":
          - "FORBIDDEN"
          - "ACCOUNT_NOT_APPROVED"
        "500":
          - "INTERNAL_ERROR"
      responses:
        "200":
          description: "Успешно."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StudentListResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "500":
          $ref: "#/components/responses/InternalServerError"
  /api/v1/students/{id}:
    get:
      tags:
        - "Students"
      operationId: "getStudent"
      summary: "Получить ученика"
      description: "Возвращает профиль ученика и hasOverdue. ID библиотекаря даёт STUDENT_NOT_FOUND."
      x-allowed-roles:
        - "LIBRARIAN"
      x-required-account-status:
        - "ACTIVE"
      parameters:
        - $ref: "#/components/parameters/StudentId"
      x-error-codes:
        "400":
          - "INVALID_DATA"
        "401":
          - "INVALID_SESSION"
        "403":
          - "FORBIDDEN"
          - "ACCOUNT_NOT_APPROVED"
        "404":
          - "STUDENT_NOT_FOUND"
        "500":
          - "INTERNAL_ERROR"
      responses:
        "200":
          description: "Успешно."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Student"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalServerError"
    patch:
      tags:
        - "Students"
      operationId: "updateStudent"
      summary: "Изменить ФИО или класс ученика"
      description: >-
        Активный библиотекарь может изменить профиль ученика в любом статусе. Сам ученик редактировать профиль через API
        не может. Сервер меняет только переданные поля по правилам регистрации. Изменения видны ученику при следующем /auth/me.
      x-allowed-roles:
        - "LIBRARIAN"
      x-required-account-status:
        - "ACTIVE"
      parameters:
        - $ref: "#/components/parameters/StudentId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateStudentRequest"
      x-error-codes:
        "400":
          - "INVALID_DATA"
        "401":
          - "INVALID_SESSION"
        "403":
          - "FORBIDDEN"
          - "ACCOUNT_NOT_APPROVED"
        "404":
          - "STUDENT_NOT_FOUND"
        "415":
          - "UNSUPPORTED_MEDIA_TYPE"
        "500":
          - "INTERNAL_ERROR"
      responses:
        "200":
          description: "Успешно."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Student"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "415":
          $ref: "#/components/responses/UnsupportedMediaType"
        "500":
          $ref: "#/components/responses/InternalServerError"
  /api/v1/students/{id}/status:
    patch:
      tags:
        - "Students"
      operationId: "updateStudentStatus"
      summary: "Подтвердить или отклонить регистрацию"
      description: >-
        PENDING → ACTIVE или REJECTED. Повтор текущего итогового статуса возвращает текущую запись. Смена итогового
        решения даёт INVALID_ACCOUNT_STATE. Сессия ученика сохраняется, /auth/me отражает новое состояние.
      x-allowed-roles:
        - "LIBRARIAN"
      x-required-account-status:
        - "ACTIVE"
      parameters:
        - $ref: "#/components/parameters/StudentId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateStudentStatusRequest"
      x-error-codes:
        "400":
          - "INVALID_DATA"
        "401":
          - "INVALID_SESSION"
        "403":
          - "FORBIDDEN"
          - "ACCOUNT_NOT_APPROVED"
        "404":
          - "STUDENT_NOT_FOUND"
        "409":
          - "INVALID_ACCOUNT_STATE"
        "415":
          - "UNSUPPORTED_MEDIA_TYPE"
        "500":
          - "INTERNAL_ERROR"
      responses:
        "200":
          description: "Успешно."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Student"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "415":
          $ref: "#/components/responses/UnsupportedMediaType"
        "500":
          $ref: "#/components/responses/InternalServerError"
  /media/covers/{key}:
    get:
      tags:
        - "Books"
      operationId: "getBookCover"
      summary: "Получить публичную обложку"
      description: >-
        Читает WebP по серверному ключу из coverUrl, в том числе для архивной книги. Неизвестный или недопустимый ключ
        даёт COVER_NOT_FOUND.
      x-allowed-roles: []
      x-access: "public"
      security: []
      parameters:
        - name: "key"
          in: "path"
          required: true
          schema:
            type: "string"
            description: "Сгенерированный сервером ключ WebP."
      x-error-codes:
        "404":
          - "COVER_NOT_FOUND"
        "500":
          - "INTERNAL_ERROR"
      responses:
        "200":
          description: "Обложка в формате WebP."
          content:
            image/webp:
              schema:
                type: "string"
                format: "binary"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalServerError"
  /health:
    get:
      tags:
        - "Health"
      operationId: "getHealth"
      summary: "Проверить доступность HTTP-процесса"
      description: "Возвращает OK, когда HTTP-процесс отвечает. Flyway мигрирует схему до старта HTTP."
      x-allowed-roles: []
      x-access: "public"
      security: []
      responses:
        "200":
          description: "HTTP-процесс отвечает."
          content:
            text/plain:
              schema:
                type: "string"
                const: "OK"
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      description: >
        Непрозрачный серверный токен из /api/v1/auth/register или /api/v1/auth/login.
        Токен содержит 32 случайных байта, закодированных в Base64 URL-safe без padding (43 символа).
        Сервер хранит только SHA-256-хеш токена.
  parameters:
    BookId:
      name: id
      in: path
      required: true
      schema:
        type: string
        format: uuid
      description: ID книги.
    ReservationId:
      name: id
      in: path
      required: true
      schema:
        type: string
        format: uuid
      description: ID заявки.
    StudentId:
      name: id
      in: path
      required: true
      schema:
        type: string
        format: uuid
      description: ID ученика.
    FavoriteBookId:
      name: bookId
      in: path
      required: true
      schema:
        type: string
        format: uuid
      description: ID книги.
    Limit:
      name: limit
      in: query
      required: false
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 20
    Offset:
      name: offset
      in: query
      required: false
      schema:
        type: integer
        minimum: 0
        default: 0
  responses:
    BadRequest:
      description: Некорректный формат или данные запроса. Допустимые коды указаны в x-error-codes операции.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    InvalidCredentials:
      description: Неверный логин или пароль; код ошибки INVALID_CREDENTIALS.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    Unauthorized:
      description: Отсутствующая, некорректная, отозванная или истёкшая сессия; код ошибки INVALID_SESSION.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    Forbidden:
      description: FORBIDDEN при недостаточной роли или запрещённой операции, ACCOUNT_NOT_APPROVED для подходящей роли с неподтверждённым аккаунтом.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    NotFound:
      description: Ресурс не найден.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    Conflict:
      description: Конфликт бизнес-правил. Допустимые коды указаны в x-error-codes операции.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    PayloadTooLarge:
      description: Превышен лимит размера файла. Код PAYLOAD_TOO_LARGE.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    UnsupportedMediaType:
      description: Неподдерживаемый тип содержимого запроса или формат изображения. Код UNSUPPORTED_MEDIA_TYPE.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    TooManyRequests:
      description: >
        Превышен лимит регистрации и входа. Оба маршрута используют общую квоту
        30 запросов в минуту с одного IP-адреса и 120 запросов в минуту на экземпляр сервера.
        Код ошибки RATE_LIMITED.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    InternalServerError:
      description: Внутренняя ошибка сервера. Код INTERNAL_ERROR.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
  schemas:
    UtcDateTime:
      type: string
      format: date-time
      pattern: Z$
      description: Момент времени в UTC (RFC 3339, суффикс Z), допускаются доли секунды.
    Role:
      type: string
      description: Роль учётной записи.
      enum:
        - STUDENT
        - LIBRARIAN
    AccountStatus:
      type: string
      description: Статус учётной записи.
      enum:
        - PENDING
        - ACTIVE
        - REJECTED
    ReservationStatus:
      type: string
      description: >-
        Срок PROCESSING не ограничен. При текущем времени не раньше pickupDeadlineAt заявка APPROVED возвращается
        как COMPLETED с причиной PICKUP_EXPIRED и closedAt, равным pickupDeadlineAt. При текущем времени не раньше
        dueAt заявка ISSUED возвращается как OVERDUE. При чтении учитываются фактические сроки независимо от фонового
        обновления. Ручные переходы описаны у соответствующих операций.
      enum:
        - PROCESSING
        - APPROVED
        - ISSUED
        - OVERDUE
        - REJECTED
        - COMPLETED
    CloseReason:
      type: string
      description: Причина завершения заявки со статусом COMPLETED.
      enum:
        - RETURNED
        - CANCELLED_BY_STUDENT
        - CANCELLED_BY_LIBRARIAN
        - PICKUP_EXPIRED
    BookSort:
      type: string
      description: Сортировка каталога. По умолчанию дата создания по убыванию, затем UUID по возрастанию.
      enum:
        - default
        - rating_desc
        - rating_asc
    ReservationGroup:
      type: string
      description: Группа active включает PROCESSING, APPROVED, ISSUED и OVERDUE. Группа completed включает REJECTED и COMPLETED.
      enum:
        - active
        - completed
    LoanDuration:
      type: integer
      enum:
        - 14
        - 28
      description: Продолжительность выдачи в интервалах по 24 часа (14 либо 28).
    ErrorCode:
      type: string
      description: Допустимые коды ошибок API.
      enum:
        - LOGIN_ALREADY_EXISTS
        - ISBN_ALREADY_EXISTS
        - INVALID_ACCOUNT_STATE
        - INVALID_CREDENTIALS
        - INVALID_DATA
        - INTERNAL_ERROR
        - UNSUPPORTED_MEDIA_TYPE
        - RATE_LIMITED
        - INVALID_SESSION
        - ACCOUNT_NOT_APPROVED
        - FORBIDDEN
        - BOOK_NOT_FOUND
        - STUDENT_NOT_FOUND
        - RESERVATION_NOT_FOUND
        - COVER_NOT_FOUND
        - BOOK_NOT_ACCEPTING_RESERVATIONS
        - NO_AVAILABLE_COPIES
        - ACTIVE_RESERVATION_EXISTS
        - OVERDUE_BLOCK
        - INVALID_DURATION
        - INVALID_RESERVATION_STATE
        - PICKUP_EXPIRED
        - STOCK_BELOW_COMMITTED
        - BOOK_HAS_ACTIVE_RESERVATIONS
        - REVIEW_NOT_ALLOWED
        - INVALID_IMAGE
        - PAYLOAD_TOO_LARGE
    ErrorDetails:
      type: object
      description: Дополнительные сведения об ошибке; структура зависит от кода.
      additionalProperties: true
    Error:
      type: object
      properties:
        code:
          $ref: "#/components/schemas/ErrorCode"
        message:
          type: string
        details:
          $ref: "#/components/schemas/ErrorDetails"
      required:
        - code
        - message
        - details
      allOf:
        - if:
            properties:
              code:
                const: ISBN_ALREADY_EXISTS
          then:
            properties:
              details:
                required:
                  - bookId
                  - archived
                properties:
                  bookId:
                    type: string
                    format: uuid
                  archived:
                    type: boolean
      additionalProperties: false
    ErrorResponse:
      type: object
      properties:
        error:
          $ref: "#/components/schemas/Error"
      required:
        - error
      additionalProperties: false
    User:
      type: object
      properties:
        id:
          type: string
          format: uuid
        login:
          type: string
          example: ivanov8a
          minLength: 3
          maxLength: 32
          pattern: "^[a-z0-9._-]+$"
        lastName:
          type: string
          example: Иванов
          minLength: 1
          maxLength: 100
        firstName:
          type: string
          example: Иван
          minLength: 1
          maxLength: 100
        middleName:
          example: Иванович
          type:
            - string
            - "null"
          maxLength: 100
          minLength: 1
        grade:
          type:
            - integer
            - "null"
          minimum: 1
          maximum: 11
        classLetter:
          type:
            - string
            - "null"
          minLength: 1
          maxLength: 5
        role:
          $ref: "#/components/schemas/Role"
        status:
          $ref: "#/components/schemas/AccountStatus"
      required:
        - id
        - login
        - lastName
        - firstName
        - middleName
        - grade
        - classLetter
        - role
        - status
      allOf:
        - if:
            properties:
              role:
                const: STUDENT
          then:
            properties:
              grade:
                type: integer
              classLetter:
                type: string
          else:
            properties:
              grade:
                type: "null"
              classLetter:
                type: "null"
      additionalProperties: false
    RegisterRequest:
      type: object
      description: >
        Строковые поля ФИО и класса обрезаются сервером через trim до сохранения.
        Пустое или состоящее только из пробелов middleName нормализуется в null;
        в ответе User поле всегда присутствует и содержит непустую строку либо null.
      properties:
        login:
          type: string
          example: ivanov8a
          minLength: 3
          maxLength: 32
          pattern: "^[a-zA-Z0-9._-]+$"
        password:
          type: string
          format: password
          minLength: 8
          maxLength: 64
          pattern: '^[!-~]{8,64}$'
          description: От 8 до 64 печатных ASCII-символов без пробелов.
        lastName:
          description: "Длина 1–100 в единицах строки Kotlin/JVM после обрезки пробелов по краям."
          type: string
          minLength: 1
          example: Иванов
        firstName:
          description: "Длина 1–100 в единицах строки Kotlin/JVM после обрезки пробелов по краям."
          type: string
          minLength: 1
          example: Иван
        middleName:
          description: >-
            Длина 1–100 в единицах строки Kotlin/JVM после обрезки пробелов по краям. Отсутствующее при регистрации,
            пустое или null нормализуется в null.
          type:
            - string
            - "null"
          example: Иванович
        grade:
          type: integer
          minimum: 1
          maximum: 11
        classLetter:
          description: "Длина 1–5 в единицах строки Kotlin/JVM после обрезки пробелов по краям."
          type: string
          example: А
          minLength: 1
      required:
        - login
        - password
        - lastName
        - firstName
        - grade
        - classLetter
      additionalProperties: false
    RegisterResponse:
      type: object
      properties:
        accessToken:
          type: string
          minLength: 43
          maxLength: 43
          pattern: "^[A-Za-z0-9_-]{43}$"
          description: 32 криптографически случайных байта в Base64 URL-safe без padding.
        tokenType:
          type: string
          enum:
            - Bearer
        expiresAt:
          $ref: "#/components/schemas/UtcDateTime"
          description: Фактическое время истечения сессии — ровно через 30 дней после её создания.
        user:
          $ref: "#/components/schemas/User"
      required:
        - accessToken
        - tokenType
        - expiresAt
        - user
      additionalProperties: false
    LoginRequest:
      type: object
      description: Логин принимается без учёта регистра; сервер нормализует его к нижнему регистру.
      properties:
        login:
          type: string
          minLength: 3
          maxLength: 32
          pattern: "^[a-zA-Z0-9._-]+$"
          example: "ivanov8a"
        password:
          type: string
          format: password
          minLength: 8
          maxLength: 64
          pattern: '^[!-~]{8,64}$'
      required:
        - login
        - password
      additionalProperties: false
    LoginResponse:
      type: object
      properties:
        accessToken:
          type: string
          minLength: 43
          maxLength: 43
          pattern: "^[A-Za-z0-9_-]{43}$"
          description: 32 криптографически случайных байта в Base64 URL-safe без padding.
        tokenType:
          type: string
          enum:
            - Bearer
        expiresAt:
          $ref: "#/components/schemas/UtcDateTime"
          description: Фактическое время истечения сессии — ровно через 30 дней после её создания.
        user:
          $ref: "#/components/schemas/User"
      required:
        - accessToken
        - tokenType
        - expiresAt
        - user
      additionalProperties: false
    Genre:
      type: "object"
      properties:
        id:
          type: "string"
          format: "uuid"
        name:
          type: "string"
          minLength: 1
          maxLength: 80
      required:
        - "id"
        - "name"
      additionalProperties: false
    BookSummary:
      type: "object"
      properties:
        id:
          type: "string"
          format: "uuid"
        title:
          type: "string"
          minLength: 1
          maxLength: 255
        authors:
          type: "array"
          minItems: 1
          description: "Имена авторов в порядке отображения."
          items:
            type: "string"
            minLength: 1
            maxLength: 200
        coverUrl:
          type:
            - "string"
            - "null"
          description: "Полный URL обложки или null. HTTPS в staging и production. HTTP возможен локально."
          format: "uri"
        genres:
          type: "array"
          minItems: 1
          maxItems: 10
          items:
            type: "string"
            minLength: 1
            maxLength: 80
        averageRating:
          type:
            - "number"
            - "null"
          minimum: 1
          maximum: 5
          description: "Средняя оценка до ближайшей десятой с округлением половин вверх. При отсутствии рецензий null."
        reviewCount:
          type: "integer"
          minimum: 0
        totalCopies:
          type: "integer"
          minimum: 0
          maximum: 2147483647
        reservedCopies:
          type: "integer"
          minimum: 0
          maximum: 2147483647
          description: "Все PROCESSING и только APPROVED, срок получения которых ещё не наступил."
        borrowedCopies:
          type: "integer"
          minimum: 0
          maximum: 2147483647
          description: "ISSUED и OVERDUE."
        availableCopies:
          type: "integer"
          minimum: 0
          maximum: 2147483647
          description: "totalCopies минус reservedCopies и borrowedCopies."
        acceptingReservations:
