openapi: 3.1.0
info:
  title: Bookio API
  version: 1.0.0
  description: >
    REST API школьной библиотеки Bookio. Время в UTC, RFC 3339 с суффиксом Z.
    x-allowed-roles и x-required-account-status описывают доступ. security: [] задаёт публичную операцию.
    x-error-codes перечисляет допустимые коды ошибок для каждого HTTP-статуса операции.
    При проверке защищённого запроса порядок следующий: сессия, роль, статус, входные данные, доступ к ресурсу.
    Списки возвращают total до пагинации. Повтор скалярного параметра даёт INVALID_DATA. genreId можно повторять.
    Реализованный auth и технический health доступны сейчас. Библиотечные операции описывают согласованный контракт следующих срезов.
servers:
  - url: https://bookio.duckdns.org
    description: Развёртывание на VPS.
tags:
  - name: Auth
    description: Регистрация, вход и управление сессией.
  - name: Books
    description: Каталог, жанры, обложки и управление книгами.
  - name: Reservations
    description: Бронирование, выдача, возврат и автоматические сроки.
  - name: Favorites
    description: Избранные книги ученика.
  - name: Reviews
    description: Одна редактируемая рецензия на пару ученик/книга.
  - name: Students
    description: Подтверждение, просмотр и редактирование учеников.
  - name: Health
    description: Техническая проверка HTTP-процесса.
security:
  - bearerAuth: []
paths:
  /api/v1/auth/register:
    post:
      tags:
        - Auth
      operationId: registerStudent
      x-error-codes:
        "400":
          - "INVALID_DATA"
        "409":
          - "LOGIN_ALREADY_EXISTS"
        "415":
          - "UNSUPPORTED_MEDIA_TYPE"
        "429":
          - "RATE_LIMITED"
        "500":
          - "INTERNAL_ERROR"
      summary: Зарегистрировать ученика
      description: >
        Создаёт роль STUDENT и статус PENDING, нормализует данные и сразу создаёт сессию.
        Логин нормализуется к нижнему регистру до поиска и сохранения.
        Регистрация и сессия создаются атомарно. Повторная регистрация с занятым логином
        разрешена только для STUDENT со статусом REJECTED. Профиль и пароль обновляются,
        статус становится PENDING, прежние сессии отзываются и выдаётся новая сессия.
        Все изменения выполняются атомарно. Для любого другого занятого логина,
        включая логин LIBRARIAN, возвращается 409 с LOGIN_ALREADY_EXISTS.
      x-allowed-roles: []
      x-access: public
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RegisterRequest"
      responses:
        "201":
          description: Ученик зарегистрирован; сессия создана и может использоваться сразу.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RegisterResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "409":
          $ref: "#/components/responses/Conflict"
        "415":
          $ref: "#/components/responses/UnsupportedMediaType"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        "500":
          $ref: "#/components/responses/InternalServerError"
  /api/v1/auth/login:
    post:
      tags:
        - Auth
      operationId: login
      x-error-codes:
        "400":
          - "INVALID_DATA"
        "401":
          - "INVALID_CREDENTIALS"
        "415":
          - "UNSUPPORTED_MEDIA_TYPE"
        "429":
          - "RATE_LIMITED"
        "500":
          - "INTERNAL_ERROR"
      summary: Войти в систему
      description: >
        Пользователь с любым допустимым статусом аккаунта (PENDING, ACTIVE или REJECTED) может войти.
        PENDING и REJECTED получают сессию для просмотра своего статуса, но не могут работать с библиотекой.
      x-allowed-roles: []
      x-access: public
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginRequest"
      responses:
        "200":
          description: Успешно.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LoginResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/InvalidCredentials"
        "415":
          $ref: "#/components/responses/UnsupportedMediaType"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        "500":
          $ref: "#/components/responses/InternalServerError"
  /api/v1/auth/logout:
    post:
      tags:
        - Auth
      operationId: logout
      x-error-codes:
        "401":
          - "INVALID_SESSION"
        "500":
          - "INTERNAL_ERROR"
      summary: Отозвать текущую сессию
      description: >
        Первый успешный logout отзывает только текущую сессию. После этого токен недействителен;
        повторный запрос с тем же токеном получает 401 с кодом INVALID_SESSION.
      x-allowed-roles:
        - STUDENT
        - LIBRARIAN
      x-required-account-status:
        - PENDING
        - ACTIVE
        - REJECTED
      responses:
        "204":
          description: Успешно, без тела.
        "401":
          $ref: "#/components/responses/Unauthorized"
        "500":
          $ref: "#/components/responses/InternalServerError"
  /api/v1/auth/me:
    get:
      tags:
        - Auth
      operationId: getCurrentUser
      x-error-codes:
        "401":
          - "INVALID_SESSION"
        "500":
          - "INTERNAL_ERROR"
      summary: Получить текущего пользователя
      description: Возвращает актуальный профиль, роль и статус. Чтение профиля не продлевает сессию.
      x-allowed-roles:
        - STUDENT
        - LIBRARIAN
      x-required-account-status:
        - PENDING
        - ACTIVE
        - REJECTED
      responses:
        "200":
          description: Успешно.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "500":
          $ref: "#/components/responses/InternalServerError"
  /api/v1/books:
    get:
      tags:
        - "Books"
      operationId: "listBooks"
      summary: "Получить каталог"
      description: >-
        По умолчанию только неархивные карточки. archived=true выбирает архив и доступен только библиотекарю. Поиск и
        фильтры комбинируются через AND. Один и тот же результат включается один раз. Новые книги первыми (createdAt
        DESC, id ASC). Рейтинг сортируется по исходному среднему, без оценок — в конце в обоих направлениях, при
        равенстве UUID по возрастанию. Пагинация применяется после фильтров и сортировки.
      x-allowed-roles:
        - "STUDENT"
        - "LIBRARIAN"
      x-required-account-status:
        - "ACTIVE"
      parameters:
        - name: "search"
          in: "query"
          required: false
          description: >-
            Буквальное вхождение в название или имя любого автора без учёта регистра. После обрезки пустое значение
            снимает фильтр.
          schema:
            type: "string"
        - name: "genreId"
          in: "query"
          required: false
          style: "form"
          explode: true
          description: >-
            Повторяемый параметр, например genreId=UUID1&genreId=UUID2. Достаточно совпадения одного выбранного жанра.
            Отсутствующий жанр не даёт совпадений.
          schema:
            type: "array"
            minItems: 1
            items:
              type: "string"
              format: "uuid"
        - name: "author"
          in: "query"
          required: false
          description: "Полное имя одного из авторов, сравнивается после обрезки без учёта регистра."
          schema:
            type: "string"
        - name: "year"
          in: "query"
          required: false
          description: "Точный год издания."
          schema:
            type: "integer"
            minimum: 1
            maximum: 2100
        - name: "publisher"
          in: "query"
          required: false
          description: "Полное название издательства, сравнивается после обрезки без учёта регистра."
          schema:
            type: "string"
        - name: "sort"
          in: "query"
          required: false
          description: "Режим сортировки."
          schema:
            $ref: "#/components/schemas/BookSort"
            default: "default"
        - name: "archived"
          in: "query"
          required: false
          description: "true — только архивные; доступно библиотекарю. false или отсутствие — неархивные."
          schema:
            type: "boolean"
            default: false
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Offset"
      x-error-codes:
        "400":
          - "INVALID_DATA"
        "401":
          - "INVALID_SESSION"
        "403":
          - "FORBIDDEN"
          - "ACCOUNT_NOT_APPROVED"
        "500":
          - "INTERNAL_ERROR"
      responses:
        "200":
          description: "Успешно."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BookListResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "500":
          $ref: "#/components/responses/InternalServerError"
    post:
      tags:
        - "Books"
      operationId: "createBook"
      summary: "Добавить книгу"
      description: >-
        Создаёт карточку, авторов и связи с жанрами атомарно. Обложка загружается отдельно. Заполненный
        нормализованный ISBN уникален среди всех карточек.
      x-allowed-roles:
        - "LIBRARIAN"
      x-required-account-status:
        - "ACTIVE"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BookCreateRequest"
      x-error-codes:
        "400":
          - "INVALID_DATA"
        "401":
          - "INVALID_SESSION"
        "403":
          - "FORBIDDEN"
          - "ACCOUNT_NOT_APPROVED"
        "409":
          - "ISBN_ALREADY_EXISTS"
        "415":
          - "UNSUPPORTED_MEDIA_TYPE"
        "500":
          - "INTERNAL_ERROR"
      responses:
        "201":
          description: "Книга создана."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BookDetail"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          $ref: "#/components/responses/Conflict"
        "415":
          $ref: "#/components/responses/UnsupportedMediaType"
        "500":
          $ref: "#/components/responses/InternalServerError"
  /api/v1/books/{id}:
    get:
      tags:
        - "Books"
      operationId: "getBook"
      summary: "Получить карточку книги"
      description: >-
        Архивная карточка доступна только библиотекарю. Для ученика архивная и отсутствующая книга дают
        BOOK_NOT_FOUND. isFavorite, canReview и myReview вычисляются для текущего ученика. У библиотекаря false,
        false, null.
      x-allowed-roles:
        - "STUDENT"
        - "LIBRARIAN"
      x-required-account-status:
        - "ACTIVE"
      parameters:
        - $ref: "#/components/parameters/BookId"
      x-error-codes:
        "400":
          - "INVALID_DATA"
        "401":
          - "INVALID_SESSION"
        "403":
          - "FORBIDDEN"
          - "ACCOUNT_NOT_APPROVED"
        "404":
          - "BOOK_NOT_FOUND"
        "500":
          - "INTERNAL_ERROR"
      responses:
        "200":
          description: "Успешно."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BookDetail"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalServerError"
    patch:
      tags:
        - "Books"
      operationId: "updateBook"
      summary: "Изменить книгу"
      description: >-
        Изменяет действующую карточку атомарно. totalCopies не может быть меньше числа зарезервированных и выданных
        экземпляров. Архивная или отсутствующая карточка даёт BOOK_NOT_FOUND.
      x-allowed-roles:
        - "LIBRARIAN"
      x-required-account-status:
        - "ACTIVE"
      parameters:
        - $ref: "#/components/parameters/BookId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BookUpdateRequest"
      x-error-codes:
        "400":
          - "INVALID_DATA"
        "401":
          - "INVALID_SESSION"
        "403":
          - "FORBIDDEN"
          - "ACCOUNT_NOT_APPROVED"
        "404":
          - "BOOK_NOT_FOUND"
        "409":
          - "ISBN_ALREADY_EXISTS"
          - "STOCK_BELOW_COMMITTED"
        "415":
          - "UNSUPPORTED_MEDIA_TYPE"
        "500":
          - "INTERNAL_ERROR"
      responses:
        "200":
          description: "Успешно."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BookDetail"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "415":
          $ref: "#/components/responses/UnsupportedMediaType"
        "500":
          $ref: "#/components/responses/InternalServerError"
    delete:
      tags:
        - "Books"
      operationId: "archiveBook"
      summary: "Архивировать книгу"
      description: >-
        Разрешено при отсутствии действующих заявок и выдач. Устанавливает archivedAt, выключает новые заявки и
        сохраняет карточку, ISBN, обложку и историю. Повторное архивирование успешно.
      x-allowed-roles:
        - "LIBRARIAN"
      x-required-account-status:
        - "ACTIVE"
      parameters:
        - $ref: "#/components/parameters/BookId"
      x-error-codes:
        "400":
          - "INVALID_DATA"
        "401":
          - "INVALID_SESSION"
        "403":
          - "FORBIDDEN"
          - "ACCOUNT_NOT_APPROVED"
        "404":
          - "BOOK_NOT_FOUND"
        "409":
          - "BOOK_HAS_ACTIVE_RESERVATIONS"
        "500":
          - "INTERNAL_ERROR"
      responses:
        "204":
          description: "Успешно, без тела."
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "500":
          $ref: "#/components/responses/InternalServerError"
  /api/v1/books/{id}/restore:
    post:
      tags:
        - "Books"
      operationId: "restoreBook"
      summary: "Восстановить книгу"
      description: >-
        Восстанавливает существующую карточку с тем же ID и ISBN, очищает archivedAt и оставляет
        acceptingReservations=false. Если карточка уже действующая, возвращает её без изменений. Тело отсутствует.
      x-allowed-roles:
        - "LIBRARIAN"
      x-required-account-status:
        - "ACTIVE"
      parameters:
        - $ref: "#/components/parameters/BookId"
      x-error-codes:
        "400":
          - "INVALID_DATA"
        "401":
          - "INVALID_SESSION"
        "403":
          - "FORBIDDEN"
          - "ACCOUNT_NOT_APPROVED"
        "404":
          - "BOOK_NOT_FOUND"
        "500":
          - "INTERNAL_ERROR"
      responses:
        "200":
          description: "Успешно."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BookDetail"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalServerError"
  /api/v1/books/{id}/cover:
    post:
      tags:
        - "Books"
      operationId: "uploadBookCover"
      summary: "Загрузить или заменить обложку"
      description: >-
        Требуется ровно одна файловая часть file. Отсутствующая часть, повтор или дополнительные части дают INVALID_DATA.
        Сервер принимает JPEG, PNG и WebP, проверяет фактическое содержимое. Максимум 2097152 байта для файла
        и 20000000 пикселей (ширина × высота) до декодирования. Сохраняет WebP с длинной стороной до 1200 пикселей.
        Android уменьшает и кодирует фото в WebP до 2 МиБ перед отправкой. После успеха клиент перечитывает карточку:
        у нового файла новый URL. При сбое предыдущая обложка остаётся доступна. Архивной или отсутствующей книге
        соответствует BOOK_NOT_FOUND.
      x-allowed-roles:
        - "LIBRARIAN"
      x-required-account-status:
        - "ACTIVE"
      parameters:
        - $ref: "#/components/parameters/BookId"
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: "object"
              properties:
                file:
                  type: "string"
                  description: "Подготовленный файл обложки."
                  format: "binary"
              required:
                - "file"
              additionalProperties: false
      x-error-codes:
        "400":
          - "INVALID_DATA"
          - "INVALID_IMAGE"
        "401":
          - "INVALID_SESSION"
        "403":
          - "FORBIDDEN"
          - "ACCOUNT_NOT_APPROVED"
        "404":
          - "BOOK_NOT_FOUND"
        "413":
          - "PAYLOAD_TOO_LARGE"
        "415":
          - "UNSUPPORTED_MEDIA_TYPE"
        "500":
          - "INTERNAL_ERROR"
      responses:
        "204":
          description: "Успешно, без тела."
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "413":
          $ref: "#/components/responses/PayloadTooLarge"
        "415":
          $ref: "#/components/responses/UnsupportedMediaType"
        "500":
          $ref: "#/components/responses/InternalServerError"
  /api/v1/genres:
    get:
      tags:
        - "Books"
      operationId: "listGenres"
      summary: "Получить справочник жанров"
      description: >-
        Содержит жанры с хотя бы одной неархивной книгой. Сортировка по имени без учёта регистра, затем UUID по
        возрастанию. Пагинация применяется после фильтров и сортировки.
      x-allowed-roles:
        - "STUDENT"
        - "LIBRARIAN"
      x-required-account-status:
        - "ACTIVE"
      parameters:
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Offset"
      x-error-codes:
        "400":
          - "INVALID_DATA"
        "401":
          - "INVALID_SESSION"
        "403":
          - "FORBIDDEN"
          - "ACCOUNT_NOT_APPROVED"
        "500":
          - "INTERNAL_ERROR"
      responses:
        "200":
          description: "Успешно."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GenreListResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "500":
          $ref: "#/components/responses/InternalServerError"
  /api/v1/reservations:
    post:
      tags:
        - "Reservations"
      operationId: "createReservation"
      summary: "Забронировать книгу"
      description: >-
        ID ученика берётся из сессии. PROCESSING сразу резервирует один экземпляр. После валидации проверяются по
        порядку: существование неархивной книги, просрочка ученика, его действующая заявка на эту книгу, разрешение
        новых заявок и наличие экземпляра. При одновременном бронировании последнего экземпляра только один запрос
        успешен.
      x-allowed-roles:
        - "STUDENT"
      x-required-account-status:
        - "ACTIVE"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateReservationRequest"
      x-error-codes:
        "400":
          - "INVALID_DATA"
          - "INVALID_DURATION"
        "401":
          - "INVALID_SESSION"
        "403":
          - "FORBIDDEN"
          - "ACCOUNT_NOT_APPROVED"
        "404":
          - "BOOK_NOT_FOUND"
        "409":
          - "OVERDUE_BLOCK"
          - "ACTIVE_RESERVATION_EXISTS"
          - "BOOK_NOT_ACCEPTING_RESERVATIONS"
          - "NO_AVAILABLE_COPIES"
        "415":
          - "UNSUPPORTED_MEDIA_TYPE"
