components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      description: >
        Непрозрачный серверный токен из /api/v1/auth/register или /api/v1/auth/login.
        Токен содержит 32 случайных байта, закодированных в Base64 URL-safe без padding (43 символа).
        Сервер хранит только SHA-256-хеш токена.
  parameters:
    BookId:
      name: id
      in: path
      required: true
      schema:
        type: string
        format: uuid
      description: ID книги.
    ReservationId:
      name: id
      in: path
      required: true
      schema:
        type: string
        format: uuid
      description: ID заявки.
    StudentId:
      name: id
      in: path
      required: true
      schema:
        type: string
        format: uuid
      description: ID ученика.
    FavoriteBookId:
      name: bookId
      in: path
      required: true
      schema:
        type: string
        format: uuid
      description: ID книги.
    Limit:
      name: limit
      in: query
      required: false
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 20
    Offset:
      name: offset
      in: query
      required: false
      schema:
        type: integer
        minimum: 0
        default: 0
  responses:
    BadRequest:
      description: Некорректный формат или данные запроса; код ошибки INVALID_DATA.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    InvalidCredentials:
      description: Неверный логин или пароль; код ошибки INVALID_CREDENTIALS.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    Unauthorized:
      description: Отсутствующая, некорректная, отозванная или истёкшая сессия; код ошибки INVALID_SESSION.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    Forbidden:
      description: Недостаточно прав, неподтверждённый аккаунт или чужой ресурс.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    NotFound:
      description: Ресурс не найден.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    Conflict:
      description: Конфликт с бизнес-правилом.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    PayloadTooLarge:
      description: Файл слишком большой.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    UnsupportedMediaType:
      description: Неподдерживаемый тип содержимого запроса. Код ошибки UNSUPPORTED_MEDIA_TYPE.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    TooManyRequests:
      description: >
        Превышен лимит регистрации и входа. Оба маршрута используют общую квоту
        30 запросов в минуту с одного IP-адреса и 120 запросов в минуту на экземпляр сервера.
        Код ошибки RATE_LIMITED.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    InternalServerError:
      description: Внутренняя ошибка сервера.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
  schemas:
    UtcDateTime:
      type: string
      format: date-time
      pattern: Z$
      description: Момент времени в UTC (RFC 3339, суффикс Z).
    Role:
      type: string
      description: Роль учётной записи.
      enum:
        - STUDENT
        - LIBRARIAN
    AccountStatus:
      type: string
      description: Статус учётной записи.
      enum:
        - PENDING
        - ACTIVE
        - REJECTED
    ReservationStatus:
      type: string
      description: Статус заявки; допустимые переходы изложены в описании операций.
      enum:
        - PROCESSING
        - APPROVED
        - ISSUED
        - OVERDUE
        - REJECTED
        - COMPLETED
    CloseReason:
      type: string
      description: Причина завершения заявки со статусом COMPLETED.
      enum:
        - RETURNED
        - CANCELLED_BY_STUDENT
        - CANCELLED_BY_LIBRARIAN
        - PICKUP_EXPIRED
    BookSort:
      type: string
      description: Сортировка каталога; по умолчанию дата добавления по убыванию, затем ID.
      enum:
        - default
        - rating_desc
        - rating_asc
    ReservationGroup:
      type: string
      description: Группировка заявок ученика.
      enum:
        - active
        - completed
    LoanDuration:
      type: integer
      enum:
        - 14
        - 28
      description: Продолжительность выдачи в днях (14 либо 28).
    ErrorCode:
      type: string
      description: Допустимые коды ошибок API.
      enum:
        - LOGIN_ALREADY_EXISTS
        - INVALID_CREDENTIALS
        - INVALID_DATA
        - INTERNAL_ERROR
        - UNSUPPORTED_MEDIA_TYPE
        - RATE_LIMITED
        - INVALID_SESSION
        - ACCOUNT_NOT_APPROVED
        - FORBIDDEN
        - BOOK_NOT_FOUND
        - BOOK_NOT_ACCEPTING_RESERVATIONS
        - NO_AVAILABLE_COPIES
        - ACTIVE_RESERVATION_EXISTS
        - OVERDUE_BLOCK
        - INVALID_DURATION
        - INVALID_RESERVATION_STATE
        - PICKUP_EXPIRED
        - STOCK_BELOW_COMMITTED
        - BOOK_HAS_ACTIVE_RESERVATIONS
        - REVIEW_NOT_ALLOWED
        - INVALID_IMAGE
    ErrorDetails:
      type: object
      description: Дополнительные сведения об ошибке; структура зависит от кода.
      additionalProperties: true
    Error:
      type: object
      properties:
        code:
          $ref: "#/components/schemas/ErrorCode"
        message:
          type: string
        details:
          $ref: "#/components/schemas/ErrorDetails"
      required:
        - code
        - message
        - details
      additionalProperties: false
    ErrorResponse:
      type: object
      properties:
        error:
          $ref: "#/components/schemas/Error"
      required:
        - error
      additionalProperties: false
    User:
      type: object
      properties:
        id:
          type: string
          format: uuid
        login:
          type: string
          example: ivanov8a
          minLength: 3
          maxLength: 32
          pattern: "^[a-zA-Z0-9._-]+$"
        lastName:
          type: string
          example: Иванов
          minLength: 1
          maxLength: 100
        firstName:
          type: string
          example: Иван
          minLength: 1
          maxLength: 100
        middleName:
          example: Иванович
          type:
            - string
            - "null"
          maxLength: 100
          minLength: 1
        grade:
          type:
            - integer
            - "null"
          minimum: 1
          maximum: 11
        classLetter:
          type:
            - string
            - "null"
          minLength: 1
          maxLength: 5
        role:
          $ref: "#/components/schemas/Role"
        status:
          $ref: "#/components/schemas/AccountStatus"
      required:
        - id
        - login
        - lastName
        - firstName
        - middleName
        - grade
        - classLetter
        - role
        - status
      additionalProperties: false
    RegisterRequest:
      type: object
      description: >
        Строковые поля ФИО и класса обрезаются сервером через trim до сохранения.
        Пустое или состоящее только из пробелов middleName нормализуется в null;
        в ответе User поле всегда присутствует и содержит непустую строку либо null.
      properties:
        login:
          type: string
          example: ivanov8a
          minLength: 3
          maxLength: 32
          pattern: "^[a-zA-Z0-9._-]+$"
        password:
          type: string
          format: password
          minLength: 8
          maxLength: 64
          pattern: '^[!-~]{8,64}$'
          description: От 8 до 64 печатных ASCII-символов без пробелов.
        lastName:
          type: string
          minLength: 1
          maxLength: 100
          example: Иванов
        firstName:
          type: string
          minLength: 1
          maxLength: 100
          example: Иван
        middleName:
          type:
            - string
            - "null"
          maxLength: 100
          example: Иванович
        grade:
          type: integer
          minimum: 1
          maximum: 11
        classLetter:
          type: string
          example: А
          minLength: 1
          maxLength: 5
      required:
        - login
        - password
        - lastName
        - firstName
        - grade
        - classLetter
      additionalProperties: false
    RegisterResponse:
      type: object
      properties:
        accessToken:
          type: string
          minLength: 43
          maxLength: 43
          pattern: "^[A-Za-z0-9_-]{43}$"
          description: 32 криптографически случайных байта в Base64 URL-safe без padding.
        tokenType:
          type: string
          enum:
            - Bearer
        expiresAt:
          $ref: "#/components/schemas/UtcDateTime"
          description: Фактическое время истечения сессии — ровно через 30 дней после её создания.
        user:
          $ref: "#/components/schemas/User"
      required:
        - accessToken
        - tokenType
        - expiresAt
        - user
      additionalProperties: false
    LoginRequest:
      type: object
      description: Логин принимается без учёта регистра; сервер нормализует его к нижнему регистру.
      properties:
        login:
          type: string
          minLength: 3
          maxLength: 32
          pattern: "^[a-zA-Z0-9._-]+$"
          example: "ivanov8a"
        password:
          type: string
          format: password
          minLength: 8
          maxLength: 64
          pattern: '^[!-~]{8,64}$'
      required:
        - login
        - password
      additionalProperties: false
    LoginResponse:
      type: object
      properties:
        accessToken:
          type: string
          minLength: 43
          maxLength: 43
          pattern: "^[A-Za-z0-9_-]{43}$"
          description: 32 криптографически случайных байта в Base64 URL-safe без padding.
        tokenType:
          type: string
          enum:
            - Bearer
        expiresAt:
          $ref: "#/components/schemas/UtcDateTime"
          description: Фактическое время истечения сессии — ровно через 30 дней после её создания.
        user:
          $ref: "#/components/schemas/User"
      required:
        - accessToken
        - tokenType
        - expiresAt
        - user
      additionalProperties: false
    Genre:
      type: object
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
      required:
        - id
        - name
      additionalProperties: false
    BookCounts:
      type: object
      properties:
        totalCopies:
          type: integer
          minimum: 0
        reservedCopies:
          type: integer
          description: Заявки PROCESSING и APPROVED.
          minimum: 0
        borrowedCopies:
          type: integer
          description: Заявки ISSUED и OVERDUE.
          minimum: 0
        availableCopies:
          type: integer
          description: totalCopies − reservedCopies − borrowedCopies.
          minimum: 0
      required:
        - totalCopies
        - reservedCopies
        - borrowedCopies
        - availableCopies
      additionalProperties: false
    BookSummary:
      type: object
      properties:
        id:
          type: string
          format: uuid
        title:
          type: string
        author:
          type: string
        coverUrl:
          type:
            - string
            - "null"
          description: HTTPS URL обложки или null.
          format: uri
        genres:
          type: array
          items:
            type: string
        averageRating:
          type:
            - number
            - "null"
          description: Среднее значение оценок либо null, если оценок нет.
        reviewCount:
          type: integer
          minimum: 0
        totalCopies:
          type: integer
          minimum: 0
        reservedCopies:
          type: integer
          minimum: 0
        borrowedCopies:
          type: integer
          minimum: 0
        availableCopies:
          type: integer
          minimum: 0
        acceptingReservations:
          type: boolean
      required:
        - id
        - title
        - author
        - coverUrl
        - genres
        - averageRating
        - reviewCount
        - totalCopies
        - reservedCopies
        - borrowedCopies
        - availableCopies
        - acceptingReservations
      additionalProperties: false
    BookDetail:
      type: object
      properties:
        id:
          type: string
          format: uuid
        title:
          type: string
        author:
          type: string
        coverUrl:
          type:
            - string
            - "null"
          description: HTTPS URL обложки или null.
          format: uri
        genres:
          type: array
          items:
            type: string
        averageRating:
          type:
            - number
            - "null"
          description: Среднее значение оценок либо null, если оценок нет.
        reviewCount:
          type: integer
          minimum: 0
        totalCopies:
          type: integer
          minimum: 0
        reservedCopies:
          type: integer
          minimum: 0
        borrowedCopies:
          type: integer
          minimum: 0
        availableCopies:
          type: integer
          minimum: 0
        acceptingReservations:
          type: boolean
        series:
          type:
            - string
            - "null"
        description:
          type:
            - string
            - "null"
        publisher:
          type: string
        publicationYear:
          type: integer
        isbn:
          type:
            - string
            - "null"
        archivedAt:
          anyOf:
            - $ref: "#/components/schemas/UtcDateTime"
            - type: "null"
        createdAt:
          $ref: "#/components/schemas/UtcDateTime"
        updatedAt:
          $ref: "#/components/schemas/UtcDateTime"
      required:
        - id
        - title
        - author
        - coverUrl
        - genres
        - averageRating
        - reviewCount
        - totalCopies
        - reservedCopies
        - borrowedCopies
        - availableCopies
        - acceptingReservations
        - series
        - description
        - publisher
        - publicationYear
        - isbn
        - archivedAt
        - createdAt
        - updatedAt
      additionalProperties: false
    BookCreateRequest:
      type: object
      properties:
        title:
          type: string
        author:
          type: string
        genres:
          type: array
          minItems: 1
          items:
            type: string
        publisher:
          type: string
        publicationYear:
          type: integer
        series:
          type:
            - string
            - "null"
        description:
          type:
            - string
            - "null"
        isbn:
          type:
            - string
            - "null"
        totalCopies:
          type: integer
          minimum: 0
        acceptingReservations:
          type: boolean
      required:
        - title
        - author
        - genres
        - publisher
        - publicationYear
        - totalCopies
        - acceptingReservations
      additionalProperties: false
    BookUpdateRequest:
      type: object
      description: "PATCH: указываются только изменяемые поля."
      properties:
        title:
          type: string
        author:
          type: string
        genres:
          type: array
          minItems: 1
          items:
            type: string
        publisher:
          type: string
        publicationYear:
          type: integer
        series:
          type:
            - string
            - "null"
        description:
          type:
            - string
            - "null"
        isbn:
          type:
            - string
            - "null"
        totalCopies:
          type: integer
          minimum: 0
        acceptingReservations:
          type: boolean
      additionalProperties: false
    BookForReservation:
