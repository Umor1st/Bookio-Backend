openapi: 3.1.0
info:
  title: Bookio API
  version: 1.0.0
  description:
    "REST API приложения школьной библиотеки Bookio. Время — в UTC, формат RFC 3339 с Z. Для защищённых
    операций x-allowed-roles задаёт разрешённые роли, x-required-account-status — допустимые статусы аккаунта; пустой
    x-allowed-roles и security: [] обозначают публичную операцию. Владение заявками проверяется сервером. Статусы
    заявок: PROCESSING→APPROVED/REJECTED/COMPLETED, APPROVED→ISSUED/COMPLETED, ISSUED→OVERDUE/COMPLETED, OVERDUE→COMPLETED.
    Общий источник истины о доступности — серверные заявки, а не клиентские счётчики."
servers:
  - url: https://bookio.duckdns.org
    description: Развёртывание на VPS.
tags:
  - name: Auth
    description: Регистрация, вход и управление сессией.
  - name: Books
    description: Каталог, жанры, обложки и управление книгами.
  - name: Reservations
    description: Бронирование, выдача, возврат и автоматические сроки.
  - name: Favorites
    description: Избранные книги ученика.
  - name: Reviews
    description: Одна редактируемая рецензия на пару ученик/книга.
  - name: Students
    description: Подтверждение и просмотр учеников библиотекарем.
security:
  - bearerAuth: []
paths:
  /api/v1/auth/register:
    post:
      tags:
        - Auth
      operationId: registerStudent
      summary: Зарегистрировать ученика
      description: >
        Создаёт роль STUDENT и статус PENDING, нормализует данные и сразу создаёт сессию.
        Логин нормализуется к нижнему регистру до поиска и сохранения.
        Регистрация и сессия создаются атомарно. Повторная регистрация с занятым логином
        разрешена только для STUDENT со статусом REJECTED. Профиль и пароль обновляются,
        статус становится PENDING, прежние сессии отзываются и выдаётся новая сессия.
        Все изменения выполняются атомарно. Для любого другого занятого логина,
        включая логин LIBRARIAN, возвращается 409 с LOGIN_ALREADY_EXISTS.
      x-allowed-roles: []
      x-access: public
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RegisterRequest"
      responses:
        "201":
          description: Ученик зарегистрирован; сессия создана и может использоваться сразу.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RegisterResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "409":
          $ref: "#/components/responses/Conflict"
        "415":
          $ref: "#/components/responses/UnsupportedMediaType"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        "500":
          $ref: "#/components/responses/InternalServerError"
  /api/v1/auth/login:
    post:
      tags:
        - Auth
      operationId: login
      summary: Войти в систему
      description: >
        Пользователь с любым допустимым статусом аккаунта (PENDING, ACTIVE или REJECTED) может войти.
        PENDING и REJECTED получают сессию для просмотра своего статуса, но не могут работать с библиотекой.
      x-allowed-roles: []
      x-access: public
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginRequest"
      responses:
        "200":
          description: Успешно.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LoginResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/InvalidCredentials"
        "415":
          $ref: "#/components/responses/UnsupportedMediaType"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        "500":
          $ref: "#/components/responses/InternalServerError"
  /api/v1/auth/logout:
    post:
      tags:
        - Auth
      operationId: logout
      summary: Отозвать текущую сессию
      description: >
        Первый успешный logout отзывает только текущую сессию. После этого токен недействителен;
        повторный запрос с тем же токеном получает 401 с кодом INVALID_SESSION.
      x-allowed-roles:
        - STUDENT
        - LIBRARIAN
      x-required-account-status:
        - PENDING
        - ACTIVE
        - REJECTED
      responses:
        "204":
          description: Успешно, без тела.
        "401":
          $ref: "#/components/responses/Unauthorized"
        "500":
          $ref: "#/components/responses/InternalServerError"
  /api/v1/auth/me:
    get:
      tags:
        - Auth
      operationId: getCurrentUser
      summary: Получить текущего пользователя
      x-allowed-roles:
        - STUDENT
        - LIBRARIAN
      x-required-account-status:
        - PENDING
        - ACTIVE
        - REJECTED
      responses:
        "200":
          description: Успешно.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "500":
          $ref: "#/components/responses/InternalServerError"
  /api/v1/books:
    get:
      tags:
        - Books
      operationId: listBooks
      summary: Получить каталог
      description:
        "Обычный каталог исключает архивированные книги. Для default: дата добавления по убыванию, затем
        ID. Книги без оценок при сортировке по рейтингу идут последними."
      x-allowed-roles:
        - STUDENT
        - LIBRARIAN
      x-required-account-status:
        - ACTIVE
      parameters:
        - name: search
          in: query
          required: false
          schema:
            type: string
          description: Поиск по названию или автору.
        - name: genreId
          in: query
          required: false
          schema:
            type: string
            format: uuid
        - name: author
          in: query
          required: false
          schema:
            type: string
        - name: year
          in: query
          required: false
          schema:
            type: integer
        - name: publisher
          in: query
          required: false
          schema:
            type: string
        - name: sort
          in: query
          required: false
          schema:
            $ref: "#/components/schemas/BookSort"
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Offset"
      responses:
        "200":
          description: Успешно.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BookListResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "500":
          $ref: "#/components/responses/InternalServerError"
    post:
      tags:
        - Books
      operationId: createBook
      summary: Добавить книгу
      description: Жанры задаются именами, после создания обложку можно загрузить отдельно.
      x-allowed-roles:
        - LIBRARIAN
      x-required-account-status:
        - ACTIVE
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BookCreateRequest"
      responses:
        "201":
          description: Создано.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BookDetail"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          $ref: "#/components/responses/Conflict"
        "500":
          $ref: "#/components/responses/InternalServerError"
  /api/v1/books/{id}:
    get:
      tags:
        - Books
      operationId: getBook
      summary: Получить карточку книги
      x-allowed-roles:
        - STUDENT
        - LIBRARIAN
      x-required-account-status:
        - ACTIVE
      parameters:
        - $ref: "#/components/parameters/BookId"
      responses:
        "200":
          description: Успешно.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BookDetail"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalServerError"
    patch:
      tags:
        - Books
      operationId: updateBook
      summary: Изменить книгу
      description: totalCopies не может быть меньше числа зарезервированных и выданных экземпляров.
      x-allowed-roles:
        - LIBRARIAN
      x-required-account-status:
        - ACTIVE
      parameters:
        - $ref: "#/components/parameters/BookId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BookUpdateRequest"
      responses:
        "200":
          description: Успешно.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BookDetail"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "500":
          $ref: "#/components/responses/InternalServerError"
    delete:
      tags:
        - Books
      operationId: archiveBook
      summary: Архивировать книгу
      description: Физически не удалять. Если есть активные заявки, вернуть BOOK_HAS_ACTIVE_RESERVATIONS.
      x-allowed-roles:
        - LIBRARIAN
      x-required-account-status:
        - ACTIVE
      parameters:
        - $ref: "#/components/parameters/BookId"
      responses:
        "204":
          description: Успешно, без тела.
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "500":
          $ref: "#/components/responses/InternalServerError"
  /api/v1/books/{id}/cover:
    post:
      tags:
        - Books
      operationId: uploadBookCover
      summary: Загрузить обложку книги
      x-allowed-roles:
        - LIBRARIAN
      x-required-account-status:
        - ACTIVE
      parameters:
        - $ref: "#/components/parameters/BookId"
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                file:
                  type: string
                  description: JPEG, PNG или WebP; клиент по возможности предварительно преобразует в WebP.
                  format: binary
              required:
                - file
              additionalProperties: false
        description: На сервере проверяются фактический формат и размер файла; хранение в WebP.
      responses:
        "204":
          description: Успешно, без тела.
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "413":
          $ref: "#/components/responses/PayloadTooLarge"
        "415":
          $ref: "#/components/responses/UnsupportedMediaType"
        "500":
          $ref: "#/components/responses/InternalServerError"
  /api/v1/genres:
    get:
      tags:
        - Books
      operationId: listGenres
      summary: Получить справочник жанров
      x-allowed-roles:
        - STUDENT
        - LIBRARIAN
      x-required-account-status:
        - ACTIVE
      parameters:
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Offset"
      responses:
        "200":
          description: Успешно.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GenreListResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "500":
          $ref: "#/components/responses/InternalServerError"
  /api/v1/reservations:
    post:
      tags:
        - Reservations
      operationId: createReservation
      summary: Забронировать книгу
      description:
        Создание PROCESSING сразу резервирует экземпляр в транзакции с блокировкой книги. Ученик не может
        создать вторую активную бронь этой книги или любую новую бронь при просрочке.
      x-allowed-roles:
        - STUDENT
      x-required-account-status:
        - ACTIVE
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateReservationRequest"
      responses:
        "201":
          description: Создано.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Reservation"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "500":
          $ref: "#/components/responses/InternalServerError"
    get:
      tags:
        - Reservations
      operationId: listReservations
      summary: Получить заявки для библиотекаря
      x-allowed-roles:
        - LIBRARIAN
      x-required-account-status:
        - ACTIVE
      parameters:
        - name: status
          in: query
          required: false
          schema:
            $ref: "#/components/schemas/ReservationStatus"
          description: Если не указан, возвращаются активные заявки.
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Offset"
      responses:
        "200":
          description: Успешно.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReservationListResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "500":
          $ref: "#/components/responses/InternalServerError"
  /api/v1/reservations/my:
    get:
      tags:
        - Reservations
      operationId: listMyReservations
      summary: Получить собственные заявки
      x-allowed-roles:
        - STUDENT
      x-required-account-status:
        - ACTIVE
      parameters:
        - name: group
          in: query
          required: false
          schema:
            $ref: "#/components/schemas/ReservationGroup"
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Offset"
      responses:
        "200":
          description: Успешно.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReservationListResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "500":
          $ref: "#/components/responses/InternalServerError"
  /api/v1/reservations/{id}:
    get:
      tags:
        - Reservations
      operationId: getReservation
      summary: Получить детали заявки
      description: Ученик имеет доступ только к собственной заявке; библиотекарь — к любой.
      x-allowed-roles:
        - STUDENT
        - LIBRARIAN
      x-required-account-status:
        - ACTIVE
      parameters:
        - $ref: "#/components/parameters/ReservationId"
      responses:
        "200":
          description: Успешно.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Reservation"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalServerError"
  /api/v1/reservations/{id}/cancel:
    post:
      tags:
        - Reservations
      operationId: cancelReservation
      summary: Отменить заявку до выдачи
      description:
        Ученик отменяет только свою PROCESSING/APPROVED; библиотекарь может отменить PROCESSING/APPROVED.
        Итоговый статус COMPLETED с соответствующим closeReason.
      x-allowed-roles:
        - STUDENT
        - LIBRARIAN
      x-required-account-status:
        - ACTIVE
      parameters:
        - $ref: "#/components/parameters/ReservationId"
      responses:
        "200":
          description: Успешно.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Reservation"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "500":
          $ref: "#/components/responses/InternalServerError"
  /api/v1/reservations/{id}/approve:
    post:
      tags:
        - Reservations
      operationId: approveReservation
      summary: Одобрить заявку
      description:
        PROCESSING → APPROVED; срок получения = approvedAt + 72 часа, утверждённый срок выдачи 14 или 28
        дней.
      x-allowed-roles:
        - LIBRARIAN
      x-required-account-status:
        - ACTIVE
      parameters:
        - $ref: "#/components/parameters/ReservationId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ApproveReservationRequest"
      responses:
        "200":
          description: Успешно.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Reservation"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "500":
          $ref: "#/components/responses/InternalServerError"
  /api/v1/reservations/{id}/reject:
    post:
      tags:
        - Reservations
      operationId: rejectReservation
      summary: Отклонить заявку
      description: PROCESSING → REJECTED; причина отказа необязательна.
      x-allowed-roles:
        - LIBRARIAN
      x-required-account-status:
        - ACTIVE
      parameters:
        - $ref: "#/components/parameters/ReservationId"
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RejectReservationRequest"
      responses:
        "200":
          description: Успешно.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Reservation"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "500":
          $ref: "#/components/responses/InternalServerError"
  /api/v1/reservations/{id}/issue:
    post:
      tags:
        - Reservations
      operationId: issueReservation
      summary: Подтвердить выдачу книги
      description:
        APPROVED → ISSUED до истечения pickupDeadlineAt; сервер устанавливает issuedAt и dueAt от времени
        выдачи.
      x-allowed-roles:
        - LIBRARIAN
      x-required-account-status:
        - ACTIVE
      parameters:
        - $ref: "#/components/parameters/ReservationId"
      responses:
        "200":
          description: Успешно.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Reservation"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "500":
          $ref: "#/components/responses/InternalServerError"
  /api/v1/reservations/{id}/complete:
    post:
      tags:
        - Reservations
      operationId: completeReservation
      summary: Подтвердить возврат книги
      description: ISSUED/OVERDUE → COMPLETED, closeReason=RETURNED.
      x-allowed-roles:
        - LIBRARIAN
      x-required-account-status:
        - ACTIVE
      parameters:
        - $ref: "#/components/parameters/ReservationId"
      responses:
        "200":
          description: Успешно.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Reservation"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "500":
          $ref: "#/components/responses/InternalServerError"
  /api/v1/favorites:
    get:
      tags:
        - Favorites
      operationId: listFavorites
      summary: Получить избранные книги
      description: Архивные книги исключаются из основного списка избранного; связи сохраняются.
      x-allowed-roles:
        - STUDENT
      x-required-account-status:
        - ACTIVE
      parameters:
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Offset"
      responses:
        "200":
          description: Успешно.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FavoriteListResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "500":
          $ref: "#/components/responses/InternalServerError"
  /api/v1/favorites/{bookId}:
    put:
      tags:
        - Favorites
      operationId: addFavorite
      summary: Добавить книгу в избранное
      description: Идемпотентная операция.
      x-allowed-roles:
        - STUDENT
      x-required-account-status:
        - ACTIVE
